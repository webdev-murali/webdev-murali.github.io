<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Google Home </title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <link rel="stylesheet" href="../assets/css/pages/google-home.css">
</head>
<body>
    <div class="container ">

        <div class="row justify-content-center" style="margin-top: 10rem;">
            <div class="col-lg-3">&nbsp;</div>
            <div class="col-lg-6">
                <div class="d-flex flex-row letters text-center justify-content-center">
                    <span>M</span>
                    <span>u</span>
                    <span>r</span>
                    <span>a</span>
                    <span>l</span>
                    <span>i</span>
                </div>
            </div>
            <div class="col-lg-3">&nbsp;</div>
        </div>

        <div class="row justify-content-center">
            <div class="col-lg-3">&nbsp;</div>
            <div class="col-lg-6">
                <div class="">
                    <form action="">

                        <div class="search_input">
                            <span class="searchIcon"><img src="../assets/img/icon_search.svg" alt=""></span>
                            <input type="text" class="search" placeholder="Search Google or type a URL">
                            <span class="voiceIcon"></span>
                            <span class="imageIcon"></span>
                        </div>
                    </form>
                </div>
            </div>
            <div class="col-lg-3">&nbsp;</div>
        </div>
        <br>
        <div class="row justify-content-center mt-3">
            <div class="col-lg-2">&nbsp;</div>
            <div class="col-lg-8">
                <div class="d-flex flex-row">
                    <div class="col-lg-2">
                        <div class="card">
                            <div class="card-body">
                                <div class=" bg-light">
                                    <img src="../assets/img/pc-pic-1.jpg" alt="" class="img-fluid " width="80%">
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="col-lg-2">&nbsp;</div>
        </div>
    </div>
</body>
</html>
